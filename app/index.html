<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0e0a0a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Rosary Yoga" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="description" content="A nightly anchor for body, mind, and the work ahead." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/icons/icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Cormorant+SC:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <title>Rosary Yoga</title>
</head>
<body>
  <main id="app" aria-live="polite">
    <header class="top-bar">
      <div class="position-label" id="positionLabel"></div>
      <button class="menu-button" id="menuButton" aria-label="Open menu" type="button">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="5" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="12" cy="19" r="1.2"/></svg>
      </button>
    </header>

    <section class="card-stage" id="cardStage" role="region" aria-label="Practice card">
      <article class="card" id="card">
        <div class="pose-area" id="poseArea">
          <div class="pose-figure" id="poseFigure"></div>
          <div class="pose-meta">
            <h2 class="pose-name" id="poseName"></h2>
            <p class="pose-latin" id="poseLatin"></p>
          </div>
        </div>

        <div class="prayer-area">
          <div class="prayer-label" id="prayerLabel"></div>
          <div class="prayer-text" id="prayerText"></div>
        </div>
      </article>

      <button class="tap-zone tap-zone-prev" id="tapZonePrev" aria-label="Previous" type="button"></button>
      <button class="tap-zone tap-zone-next" id="tapZoneNext" aria-label="Next" type="button"></button>
    </section>

    <footer class="bottom-bar">
      <div class="rosary-strip" id="rosaryStrip" aria-label="Rosary progress"></div>
    </footer>
  </main>

  <div class="menu-overlay" id="menuOverlay" hidden>
    <div class="menu-panel" role="dialog" aria-modal="true" aria-label="Menu">
      <h1 class="menu-title">Rosary Yoga</h1>
      <p class="menu-subtitle" id="menuSubtitle"></p>
      <div class="menu-actions">
        <button class="menu-action" data-action="restart" type="button">Restart from the beginning</button>
        <button class="menu-action" data-action="mysteries" type="button">Change tonight's mysteries</button>
        <button class="menu-action" data-action="close" type="button">Close menu</button>
      </div>
      <p class="menu-footer">The poses do not change with the day.<br/>The body learns the cue.</p>
    </div>
  </div>

  <div class="mystery-overlay" id="mysteryOverlay" hidden>
    <div class="mystery-panel" role="dialog" aria-modal="true" aria-label="Choose mystery set">
      <h2 class="mystery-title">Tonight's mysteries</h2>
      <div class="mystery-options" id="mysteryOptions"></div>
      <button class="menu-action" data-action="close-mystery" type="button">Cancel</button>
    </div>
  </div>

  <script src="app.js" type="module"></script>
</body>
</html>
